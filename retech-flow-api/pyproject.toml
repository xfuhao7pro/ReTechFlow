[project]
name = "retech-flow-api"
version = "0.1.0"
description = "ReTechFlow Django API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "channels>=4.0,<5",
    "channels-redis>=4.2,<5",
    "daphne>=4.0,<5",
    "django>=6.0,<6.1",
    "django-cors-headers>=4.9,<5",
    "django-redis>=5.4,<7",
    "djangorestframework>=3.16,<3.17",
    "djangorestframework-simplejwt>=5.5,<5.6",
    "mysqlclient>=2.2,<3",
    "pillow>=11,<12",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "shortuuid>=1.0,<2",
    "sniffio>=1.3,<2",
    "zhipuai>=2.1,<3",
]

[tool.uv]
package = false
